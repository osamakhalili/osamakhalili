<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="Journey: Java backend, React frontend, TypeScript platforms, product engineering">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="0.1" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#4F46E5" stop-opacity="0.8"/>
      <stop offset="0.9" stop-color="#0891B2" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <line x1="120" y1="92" x2="1080" y2="92" stroke="url(#path)" stroke-width="2.5"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="210" y="44" font-size="10.5" letter-spacing="2.6" fill="#94A3B8">FOUNDATION</text>
    <text x="470" y="44" font-size="10.5" letter-spacing="2.6" fill="#94A3B8">INTERFACE</text>
    <text x="730" y="44" font-size="10.5" letter-spacing="2.6" fill="#94A3B8">PLATFORM</text>
    <text x="990" y="44" font-size="10.5" letter-spacing="2.6" fill="#94A3B8">PRODUCT</text>

    <text x="210" y="158" font-size="19" font-weight="650" fill="#0F172A">Java backend</text>
    <text x="210" y="182" font-size="12.5" fill="#64748B">Spring · REST</text>

    <text x="470" y="158" font-size="19" font-weight="650" fill="#0F172A">React frontend</text>
    <text x="470" y="182" font-size="12.5" fill="#64748B">Interfaces</text>

    <text x="730" y="158" font-size="19" font-weight="650" fill="#0F172A">TypeScript platforms</text>
    <text x="730" y="182" font-size="12.5" fill="#64748B">tRPC · Prisma</text>

    <text x="990" y="158" font-size="19" font-weight="650" fill="#0F172A">Product engineering</text>
    <text x="990" y="182" font-size="12.5" fill="#64748B">Payments · Auth · Ops</text>
  </g>

  <g>
    <circle cx="210" cy="92" r="62" fill="url(#glow)"/>
    <circle cx="470" cy="92" r="62" fill="url(#glow)"/>
    <circle cx="730" cy="92" r="62" fill="url(#glow)"/>
    <circle cx="990" cy="92" r="62" fill="url(#glow)"/>
  </g>

  <g font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" text-anchor="middle" fill="url(#accent)">
    <circle cx="210" cy="92" r="26" fill="#FFFFFF" stroke="url(#accent)" stroke-width="1.6"/>
    <text x="210" y="97">01</text>
    <circle cx="470" cy="92" r="26" fill="#FFFFFF" stroke="url(#accent)" stroke-width="1.6"/>
    <text x="470" y="97">02</text>
    <circle cx="730" cy="92" r="26" fill="#FFFFFF" stroke="url(#accent)" stroke-width="1.6"/>
    <text x="730" y="97">03</text>
    <circle cx="990" cy="92" r="26" fill="#FFFFFF" stroke="url(#accent)" stroke-width="1.6"/>
    <text x="990" y="97">04</text>
  </g>

  <g stroke="url(#accent)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M335 86l7 6-7 6"/>
    <path d="M595 86l7 6-7 6"/>
    <path d="M855 86l7 6-7 6"/>
  </g>
</svg>
