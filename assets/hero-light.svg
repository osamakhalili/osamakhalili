<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Osama Khalili — Full-Stack Developer</title>
  <desc id="desc">Light hero banner with name, role, availability and a terminal card showing the current stack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.5" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <radialGradient id="violetGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#C4B5FD" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A5F3FC" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#A5F3FC" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)" opacity="0.65"/>
  <circle cx="1080" cy="30" r="260" fill="url(#violetGlow)"/>
  <circle cx="900" cy="340" r="220" fill="url(#cyanGlow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="19.25" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <g>
      <rect x="64" y="58" width="34" height="34" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="81" y="81" text-anchor="middle" font-size="14" font-weight="700" fill="url(#accent)">OK</text>
      <text x="112" y="80" font-size="12" letter-spacing="3.4" fill="#64748B">FULL-STACK DEVELOPER</text>
    </g>

    <text x="64" y="158" font-size="56" font-weight="800" letter-spacing="-1.2" fill="#0F172A">Osama Khalili</text>
    <text x="64" y="198" font-size="19" fill="#475569">I build web products end to end — from data model to pixel.</text>

    <g>
      <rect x="64" y="238" width="212" height="38" rx="19" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="86" cy="257" r="5" fill="#10B981"/>
      <text x="102" y="262" font-size="12.5" fill="#0F172A">Open to collaboration</text>

      <rect x="288" y="238" width="150" height="38" rx="19" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="363" y="262" text-anchor="middle" font-size="12.5" fill="#475569">Sweden · UTC+1</text>

      <rect x="450" y="238" width="186" height="38" rx="19" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="543" y="262" text-anchor="middle" font-size="12.5" fill="#475569">TypeScript · Next.js</text>
    </g>

    <g font-size="12" letter-spacing="2.6" fill="#94A3B8">
      <text x="64" y="322">PRODUCT ENGINEERING</text>
      <text x="240" y="322">PAYMENTS</text>
      <text x="352" y="322">AUTH &amp; ROLES</text>
      <text x="474" y="322">DATA MODELLING</text>
    </g>
  </g>

  <g transform="translate(772 52)">
    <rect width="364" height="256" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M0 40h364" stroke="#E2E8F0"/>
    <circle cx="22" cy="21" r="5" fill="#F87171"/>
    <circle cx="40" cy="21" r="5" fill="#FBBF24"/>
    <circle cx="58" cy="21" r="5" fill="#34D399"/>
    <text x="182" y="25" text-anchor="middle" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11.5" fill="#94A3B8">osama — zsh</text>

    <g font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12.5">
      <text x="24" y="78" fill="#0891B2">$</text>
      <text x="44" y="78" fill="#0F172A">whoami</text>
      <text x="24" y="106" fill="#475569">full-stack developer</text>

      <text x="24" y="140" fill="#0891B2">$</text>
      <text x="44" y="140" fill="#0F172A">stack --current</text>
      <text x="24" y="168" fill="#7C3AED">next.js</text>
      <text x="86" y="168" fill="#CBD5E1">·</text>
      <text x="102" y="168" fill="#7C3AED">react</text>
      <text x="150" y="168" fill="#CBD5E1">·</text>
      <text x="166" y="168" fill="#7C3AED">typescript</text>
      <text x="24" y="192" fill="#059669">trpc</text>
      <text x="66" y="192" fill="#CBD5E1">·</text>
      <text x="82" y="192" fill="#059669">prisma</text>
      <text x="142" y="192" fill="#CBD5E1">·</text>
      <text x="158" y="192" fill="#059669">postgres</text>

      <text x="24" y="228" fill="#0891B2">$</text>
      <text x="44" y="228" fill="#0F172A">status</text>
      <text x="24" y="248" fill="#D97706">shipping products</text>
      <rect x="176" y="232" width="8" height="17" fill="#0891B2" opacity="0.8"/>
    </g>
  </g>
</svg>
