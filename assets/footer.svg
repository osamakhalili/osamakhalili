<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="title desc">
  <title id="title">Let's build something useful</title>
  <desc id="desc">Footer banner with a call to action and the GitHub profile address.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#0A0F1E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="180" rx="20" fill="url(#bg)"/>
  <circle cx="600" cy="180" r="260" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="178.5" rx="19.25" fill="none" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="540" y="34" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="92" font-size="30" font-weight="750" letter-spacing="-0.4" fill="#F8FAFC">Let's build something useful.</text>
    <text x="600" y="125" font-size="14" fill="#94A3B8">Open to product engineering and collaboration.</text>
    <text x="600" y="152" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12.5" fill="#22D3EE">github.com/osamakhalili</text>
  </g>
</svg>
