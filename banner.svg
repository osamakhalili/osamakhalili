<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Osama Khalili - Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.7" stop-color="#14264a"/>
      <stop offset="1" stop-color="#1d3a6b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#36BCF7"/>
      <stop offset="1" stop-color="#7CF5C8"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: 'Courier New', Courier, monospace; font-weight: 700; }
    @keyframes tw { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
    .s { animation: tw 2.4s ease-in-out infinite; }
    .d1 { animation-delay: .3s } .d2 { animation-delay: .9s } .d3 { animation-delay: 1.5s } .d4 { animation-delay: 2s }
    @keyframes drive { from { transform: translateX(-140px) } to { transform: translateX(1040px) } }
    .car { animation: drive 7s linear infinite; }
    @keyframes road { to { stroke-dashoffset: -60 } }
    .dash { stroke-dasharray: 30 30; animation: road .8s linear infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3px) } }
    .bob { animation: bob .5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    .float { animation: float 4s ease-in-out infinite; }
  </style>

  <rect width="900" height="300" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="s" cx="60" cy="40" r="1.6"/>
    <circle class="s d1" cx="140" cy="90" r="1.2"/>
    <circle class="s d2" cx="230" cy="30" r="1.8"/>
    <circle class="s d3" cx="330" cy="70" r="1.2"/>
    <circle class="s d4" cx="420" cy="25" r="1.5"/>
    <circle class="s d1" cx="520" cy="60" r="1.2"/>
    <circle class="s d2" cx="610" cy="35" r="1.7"/>
    <circle class="s" cx="700" cy="80" r="1.3"/>
    <circle class="s d3" cx="790" cy="28" r="1.6"/>
    <circle class="s d4" cx="850" cy="95" r="1.2"/>
    <circle class="s d2" cx="30" cy="130" r="1.2"/>
    <circle class="s d1" cx="880" cy="150" r="1.4"/>
  </g>

  <!-- moon -->
  <g class="float">
    <circle cx="790" cy="70" r="30" fill="url(#moon)" opacity="0.95"/>
    <circle cx="780" cy="62" r="6" fill="#f2c776" opacity="0.5"/>
    <circle cx="800" cy="80" r="4" fill="#f2c776" opacity="0.5"/>
  </g>

  <!-- skyline -->
  <g fill="#0c1730">
    <rect x="0" y="190" width="60" height="60"/>
    <rect x="70" y="170" width="45" height="80"/>
    <rect x="125" y="200" width="70" height="50"/>
    <rect x="210" y="160" width="40" height="90"/>
    <rect x="620" y="185" width="55" height="65"/>
    <rect x="690" y="165" width="50" height="85"/>
    <rect x="750" y="195" width="70" height="55"/>
    <rect x="830" y="175" width="70" height="75"/>
  </g>
  <g fill="#36BCF7" opacity="0.55">
    <rect x="80" y="182" width="6" height="6"/><rect x="96" y="198" width="6" height="6"/>
    <rect x="220" y="174" width="6" height="6"/><rect x="232" y="196" width="6" height="6"/>
    <rect x="700" y="180" width="6" height="6"/><rect x="718" y="204" width="6" height="6"/>
    <rect x="845" y="190" width="6" height="6"/><rect x="862" y="212" width="6" height="6"/>
  </g>

  <!-- title -->
  <text x="450" y="112" text-anchor="middle" class="mono" font-size="64" fill="url(#title)" letter-spacing="6">OSAMA KHALILI</text>
  <text x="450" y="146" text-anchor="middle" class="mono" font-size="18" fill="#cfe9ff" letter-spacing="4">FULL-STACK DEVELOPER  ·  SWEDEN</text>
  <text x="450" y="182" text-anchor="middle" class="mono blink" font-size="16" fill="#ffd98a" letter-spacing="3">▶ PRESS START ◀</text>

  <!-- road -->
  <rect x="0" y="250" width="900" height="50" fill="#0a0f1d"/>
  <rect x="0" y="250" width="900" height="3" fill="#36BCF7" opacity="0.7"/>
  <line class="dash" x1="0" y1="277" x2="900" y2="277" stroke="#ffd98a" stroke-width="3"/>

  <!-- car -->
  <g class="car">
    <g class="bob">
      <rect x="0" y="244" width="64" height="16" rx="4" fill="#36BCF7"/>
      <path d="M14 244 L22 228 L46 228 L54 244 Z" fill="#2a9bd0"/>
      <rect x="25" y="231" width="9" height="11" fill="#d9f2ff"/>
      <rect x="37" y="231" width="9" height="11" fill="#d9f2ff"/>
      <rect x="58" y="248" width="6" height="5" fill="#fff6a8"/>
      <circle cx="16" cy="261" r="7" fill="#101828" stroke="#cfe9ff" stroke-width="2"/>
      <circle cx="50" cy="261" r="7" fill="#101828" stroke="#cfe9ff" stroke-width="2"/>
      <!-- L plate -->
      <rect x="-12" y="240" width="12" height="12" rx="2" fill="#ffd98a"/>
      <text x="-6" y="250" text-anchor="middle" class="mono" font-size="10" fill="#0a0f1d">L</text>
    </g>
  </g>
</svg>
